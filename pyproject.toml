[project]
name = "paper-discovery-agent"
version = "0.1.0"
description = "A single-agent paper discovery tool that uses LLM tool calling to search and collect academic papers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pypdf>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
    "FlagEmbedding",
    "pyalex",
]

[project.scripts]
paper-agent = "paper_research_agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
mineru = ["magic-pdf"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
