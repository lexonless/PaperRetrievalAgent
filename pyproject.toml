[project]
name = "raw-feeder"
version = "0.1.0"
description = "A raw feeder for discovering papers and materializing them as source markdown for LLM Wiki."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling",
    "langchain-openai>=0.3",
    "langchain-core>=0.3",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pypdf>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
raw-feeder = "paper_research_agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
