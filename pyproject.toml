[project]
name = "paper-retrieval-agent"
version = "0.1.0"
description = "A LangGraph-based research assistant for project-centered paper retrieval and research notes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pypdf>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
paper-agent = "paper_research_agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
