[project]
name = "paper-retrieval-agent"
version = "0.1.0"
description = "A starter AutoGen paper retrieval agent powered by GLM API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "autogen-agentchat>=0.4,<0.5",
    "autogen-ext[openai]>=0.4,<0.5",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
paper-agent = "paper_research_agent.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
